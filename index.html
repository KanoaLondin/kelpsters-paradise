<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kelpster's Paradise</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block}
  #join{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,10,20,.35);z-index:10}
  .card{background:rgba(6,24,40,.94);border:1px solid rgba(140,220,255,.3);border-radius:18px;padding:24px;
    width:min(350px,calc(100vw - 32px));box-sizing:border-box;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  h1{margin:0 0 4px;font-size:26px}
  .sub{margin:0 0 18px;opacity:.75;font-size:14px}
  input{box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid rgba(140,220,255,.4);
    background:rgba(0,0,0,.35);color:#fff;font-size:16px;outline:none}
  #name{width:100%}
  .coats{display:flex;gap:12px;justify-content:center;margin:16px 0 6px}
  .coat{width:54px;height:54px;border-radius:50%;border:3px solid rgba(255,255,255,.15);cursor:pointer;padding:0}
  .coat.sel{border-color:#7fe3ff;box-shadow:0 0 0 3px rgba(127,227,255,.3)}
  .coatname{font-size:13px;opacity:.75;margin-bottom:16px;height:16px}
  .go{width:100%;padding:13px;border:none;border-radius:10px;background:#38c6f4;color:#032;font-size:17px;font-weight:800;cursor:pointer}
  .go:disabled{opacity:.5}
  .credit{margin:12px 0 0;font-size:11px;opacity:.55} .credit a{color:#9fd8ff}
  #hud{position:fixed;top:12px;left:12px;display:none;flex-direction:column;gap:6px;align-items:flex-start;font-size:14px}
  .pill{background:rgba(0,0,0,.45);padding:6px 12px;border-radius:999px;border:none;color:#fff;font-size:13px}
  #invite{cursor:pointer}
  #net{border-radius:10px;font-size:11px;opacity:.85;white-space:pre-line;max-width:min(340px,70vw)}
  #btns{position:fixed;right:16px;bottom:16px;display:none;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 180px)}
  .act{padding:13px 18px;font-size:17px;border-radius:999px;border:none;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  #meow{background:#ffd166;color:#3a2600} #miao{background:#ff8fb8;color:#3d0a1e} #kelp{background:#4ccf6a;color:#06300f}
  #jump{background:#7fd6ff;color:#032;display:none} #chatbtn{background:#e8e8f0;color:#222;display:none}
  #chat{position:fixed;left:12px;bottom:16px;width:min(340px,calc(100vw - 24px));display:none;flex-direction:column;gap:6px}
  #log{display:flex;flex-direction:column;gap:3px;font-size:14px;pointer-events:none}
  #log div{background:rgba(0,0,0,.45);padding:4px 10px;border-radius:10px;align-self:flex-start;max-width:100%;overflow-wrap:anywhere;transition:opacity 1s}
  #log div.old{opacity:.35} #log b{color:#7fe3ff} #log i{color:#ffd166;font-style:normal}
  #msg{width:100%;padding:9px 12px;font-size:15px}
  .tag{position:fixed;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;will-change:transform}
  .name{font-size:13px;font-weight:600;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:8px;white-space:nowrap}
  .bubble{display:none;margin-bottom:6px;background:#fff;color:#123;font-weight:700;padding:6px 12px;border-radius:14px;position:relative;
    font-size:16px;max-width:220px;text-align:center;overflow-wrap:anywhere}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff;border-bottom:0}
  .pop{animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
  #joy{position:fixed;left:24px;bottom:24px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.25);display:none;touch-action:none}
  #knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55)}
  #help{position:fixed;top:12px;right:12px;font-size:12px;opacity:.7;display:none;text-align:right;line-height:1.5}
  body.touch #chat{bottom:160px}
</style>
</head>
<body>
<div id="join">
  <div class="card">
    <h1>🌿 Kelpster's Paradise</h1>
    <p class="sub">A walk-through aquarium for cats. Meow at friends.</p>
    <input id="name" maxlength="16" placeholder="Your username" autocomplete="off">
    <div class="coats" id="coats"></div>
    <div class="coatname" id="coatname"></div>
    <button class="go" id="go" disabled>Dive in</button>
    <p class="credit">Cat model: <a href="https://sketchfab.com/3d-models/lowpoly-cat-rig-run-animation-c36df576c9ae4ed28e89069b1a2f427a" target="_blank" rel="noopener">"Lowpoly Cat Rig + Run Animation"</a> by <a href="https://sketchfab.com/dailyfree3d" target="_blank" rel="noopener">Daily Lowpoly</a>, <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC-BY 4.0</a></p>
  </div>
</div>
<div id="hud"><div class="pill" id="count">🐾 1 cat here</div><button class="pill" id="invite">🔗 Copy invite link</button><div class="pill" id="net"></div></div>
<div id="help">WASD / arrows · walk<br>Double-tap W · sprint<br>Space · jump<br>Drag · look around<br>Enter · chat<br>M meow · N miao · K kelp<br>Esc · leave</div>
<div id="chat"><div id="log"></div><input id="msg" maxlength="120" placeholder="Press Enter to chat" autocomplete="off"></div>
<div id="btns">
  <button class="act" id="chatbtn">💬</button><button class="act" id="jump">⤒ Jump</button>
  <button class="act" id="meow">🐱 Meow</button><button class="act" id="miao">😺 Miao</button><button class="act" id="kelp">🌿 Kelp</button>
</div>
<div id="joy"><div id="knob"></div></div>

<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {clone as cloneSkinned} from 'three/addons/utils/SkeletonUtils.js';
import {joinRoom, getRelaySockets} from 'https://cdn.jsdelivr.net/npm/trystero@0.25.4/+esm';

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const lerpAngle = (a, b, t) => a + ((((b - a + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) - Math.PI) * t;
const touch = matchMedia('(pointer: coarse)').matches;
if (touch) document.body.classList.add('touch');

// ---------- renderer, bloom ----------
const renderer = new THREE.WebGLRenderer({antialias: false});
renderer.setPixelRatio(Math.min(devicePixelRatio, touch ? 1.25 : 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.03); // enables fog chunks; real colour/density come per zone below
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 260);
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, {type: THREE.HalfFloatType, samples: 4}));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.45, 1.05));
composer.addPass(new OutputPass());
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// ---------- per-zone water: each exhibit fades to its own water colour ----------
const ZONES = {
  hall:   {fog: 0x03080e, d: 0.022},
  kelp:   {fog: 0x0f4a44, d: 0.075},
  reef:   {fog: 0x1287b0, d: 0.055},
  polar:  {fog: 0x5d97b3, d: 0.065},
  amazon: {fog: 0x3f3a15, d: 0.1},
  ocean:  {fog: 0x0a3a75, d: 0.038},
};
for (const z of Object.values(ZONES)) z.u = {c: {value: new THREE.Color(z.fog)}, d: {value: z.d}};
function zoned(m, zone = 'hall') {
  const u = ZONES[zone].u;
  m.onBeforeCompile = s => {
    s.uniforms.zFogC = u.c; s.uniforms.zFogD = u.d;
    s.fragmentShader = s.fragmentShader
      .replace('#include <fog_pars_fragment>', '#include <fog_pars_fragment>\nuniform vec3 zFogC; uniform float zFogD;')
      .replace('#include <fog_fragment>', '#ifdef USE_FOG\n gl_FragColor.rgb = mix(gl_FragColor.rgb, zFogC, 1.0 - exp(-zFogD * zFogD * vFogDepth * vFogDepth));\n#endif');
  };
  m.customProgramCacheKey = () => 'zfog';
  return m;
}
const std = (color, zone = 'hall', o = {}) => zoned(new THREE.MeshStandardMaterial({color, roughness: 0.8, ...o}), zone);
const basic = (color, zone = 'hall', o = {}) => zoned(new THREE.MeshBasicMaterial({color, ...o}), zone);
const glow = (color, k = 2.5, zone = 'hall', o = {}) => { const m = basic(color, zone, o); m.color.multiplyScalar(k); return m; };
const matCache = {};
const fm = (color, zone, o) => matCache[color + zone + JSON.stringify(o || {})] ||= std(color, zone, {roughness: 0.45, ...o});

// ---------- procedural textures ----------
function causticCanvas() {
  const N = 128, c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(N, N), pts = [...Array(20)].map(() => [Math.random() * N, Math.random() * N]);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    let d1 = 1e9, d2 = 1e9;
    for (const [px, py] of pts) for (let ox = -N; ox <= N; ox += N) for (let oy = -N; oy <= N; oy += N) {
      const d = Math.hypot(i - px - ox, j - py - oy);
      if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d;
    }
    const v = Math.pow(Math.max(0, 1 - (d2 - d1) / 6), 3) * 255, k = (j * N + i) * 4;
    img.data[k] = img.data[k + 1] = img.data[k + 2] = v; img.data[k + 3] = 255;
  }
  x.putImageData(img, 0, 0); return c;
}
function rockCanvas() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  x.fillStyle = '#888'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1800; i++) {
    const g = 90 + Math.random() * 90 | 0; x.fillStyle = `rgba(${g},${g},${g},.35)`;
    x.beginPath(); x.ellipse(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 14, 2 + Math.random() * 9, Math.random() * 3, 0, 7); x.fill();
  }
  return c;
}
const caustics = [], CAUSTIC = causticCanvas(), ROCK = rockCanvas();
function tex(canvas, rx, ry, list) {
  const t = new THREE.CanvasTexture(canvas); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  if (list) list.push(t); return t;
}
const causticTex = (w, d, s = 3.5) => tex(CAUSTIC, w / s, d / s, caustics);
const rockTex = (w, d, s = 5) => { const t = tex(ROCK, w / s, d / s); t.colorSpace = THREE.SRGBColorSpace; return t; };

function jitter(g, jag, seed = Math.random() * 100) { // same position -> same offset, so faces stay stitched together
  const p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n = Math.sin(v.x * 2.1 + seed) * Math.cos(v.y * 1.7 + seed * 1.3) * Math.sin(v.z * 2.3 + seed * 0.7) + 0.5 * Math.sin(v.x * 5.3 + v.z * 4.1 + seed);
    p.setXYZ(i, v.x * (1 + n * jag), v.y * (1 + n * jag * 0.8), v.z * (1 + n * jag));
  }
  g.computeVertexNormals(); return g;
}
const rockGeo = (r, detail = 1, jag = 0.22) => jitter(new THREE.IcosahedronGeometry(r, detail), jag);

function fitText(x, text, weight, size, maxW) {
  do { x.font = `${weight} ${size}px system-ui,-apple-system,"Segoe UI",sans-serif`; size *= 0.94; } while (x.measureText(text).width > maxW && size > 8);
}
function panel(lines, w, h, accent = '#5fd8ff', bright = 1.6) {
  const W = 1024, H = Math.round(W * h / w), c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(4,12,20,.94)'; x.fillRect(0, 0, W, H);
  x.strokeStyle = accent; x.lineWidth = 10; x.strokeRect(5, 5, W - 10, H - 10);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  const rows = lines.length, step = H / (rows + 0.6);
  lines.forEach((l, i) => {
    const big = i === 0;
    fitText(x, l, big ? 800 : 500, big ? step * 0.85 : step * 0.5, W * 0.9);
    x.fillStyle = big ? '#ffffff' : accent;
    x.fillText(l, W / 2, step * (i + 0.8));
  });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  const m = basic(0xffffff, 'hall', {map: t}); m.color.setScalar(bright);
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
}

// ---------- helpers for building ----------
const add = (geo, mat, x = 0, y = 0, z = 0, parent = scene) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };
const boxAt = (x0, x1, y0, y1, z0, z1, mat) => add(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
const light = (color, intensity, dist, x, y, z) => { const l = new THREE.PointLight(color, intensity, dist, 2); l.position.set(x, y, z); scene.add(l); return l; };

// ---------- the building ----------
// Lobby (z 0-18) -> Gallery hall with 4 climate-zone windows (z 18-78) -> acrylic tunnel (z 78-112) -> ocean theater (z 112-128)
const HALL_H = 5.6, LOBBY_H = 6.5, TUN_R = 3.2;
const M = {
  floor: std(0x161d26, 'hall', {roughness: 0.28, metalness: 0.25, emissive: 0x05202b, emissiveMap: causticTex(8, 60, 2)}),
  lobbyFloor: std(0x1d2530, 'hall', {roughness: 0.3, metalness: 0.2, emissive: 0x05202b, emissiveMap: causticTex(24, 18, 2)}),
  wall: std(0x17212c, 'hall', {roughness: 0.7}),
  ceil: std(0x0c1117, 'hall', {roughness: 0.9}),
  frame: std(0x0b0f14, 'hall', {roughness: 0.35, metalness: 0.7}),
  wood: std(0x8a5a32, 'hall', {roughness: 0.55}),
  carpet: std(0x22344a, 'hall', {roughness: 0.95}),
  stone: std(0x3d4752, 'hall', {roughness: 0.6}),
  led: glow(0x3fd0ff, 2.6),
  warm: glow(0xffe2b0, 2.2),
};
const acrylic = (tint, zone = 'hall') => std(tint, zone, {transparent: true, opacity: 0.1, roughness: 0.05, metalness: 0.4, depthWrite: false, side: THREE.DoubleSide});

// lobby shell
boxAt(-12, 12, -0.3, 0, 0, 18, M.lobbyFloor);
boxAt(-12, 12, LOBBY_H, LOBBY_H + 0.3, 0, 18, M.ceil);
boxAt(-12.4, -12, 0, LOBBY_H, 0, 18, M.wall); boxAt(12, 12.4, 0, LOBBY_H, 0, 18, M.wall);
boxAt(-12, -4, 0, LOBBY_H, 18, 18.4, M.wall); boxAt(4, 12, 0, LOBBY_H, 18, 18.4, M.wall); boxAt(-4, 4, HALL_H, LOBBY_H, 18, 18.4, M.wall);
boxAt(-12, -3.2, 0, LOBBY_H, -0.4, 0, M.wall); boxAt(3.2, 12, 0, LOBBY_H, -0.4, 0, M.wall); boxAt(-3.2, 3.2, 3.4, LOBBY_H, -0.4, 0, M.wall);
const daylight = add(new THREE.PlaneGeometry(6.4, 3.4), glow(0xdff4ff, 1.6), 0, 1.7, -0.35); // entrance doors
for (const x of [-1.6, 0, 1.6]) boxAt(x - 0.05, x + 0.05, 0, 3.4, -0.3, -0.2, M.frame);
for (const x of [-8, 8]) boxAt(x - 0.6, x + 0.6, LOBBY_H - 0.06, LOBBY_H, 2, 16, M.warm);
const title = panel(["KELPSTER'S PARADISE", 'A walk-through aquarium for cats'], 9, 1.5, '#7fe3ff', 2.2);
title.position.set(0, 5.6, 17.9); title.rotation.y = Math.PI; scene.add(title);
const entrySign = panel(['Galleries ahead', 'Kelp Forest · Coral Reef · Polar Seas · Flooded Forest · Ocean Voyager'], 7, 0.9, '#ffd166');
entrySign.position.set(0, 4.75, 17.85); entrySign.rotation.y = Math.PI; scene.add(entrySign);

// hall shell
boxAt(-4, 4, -0.3, 0, 18, 78, M.floor);
boxAt(-4, 4, HALL_H, HALL_H + 0.3, 18, 78, M.ceil);
for (const x of [-2.4, 2.4]) boxAt(x - 0.12, x + 0.12, HALL_H - 0.05, HALL_H, 19, 77, M.led);
const WIN = {y0: 0.3, y1: 4.3, spans: [[21, 41], [51, 71]]};
for (const s of [-1, 1]) {
  const x0 = s < 0 ? -4.4 : 4, x1 = s < 0 ? -4 : 4.4;
  for (const [z0, z1] of [[18, 21], [41, 51], [71, 78]]) boxAt(x0, x1, 0, HALL_H, z0, z1, M.wall);
  for (const [z0, z1] of WIN.spans) {
    boxAt(x0, x1, 0, WIN.y0, z0, z1, M.wall); boxAt(x0, x1, WIN.y1, HALL_H, z0, z1, M.wall);
    const fx = s * 3.98;
    boxAt(fx - 0.06, fx + 0.06, WIN.y1 - 0.06, WIN.y1 + 0.06, z0, z1, M.frame);
    boxAt(fx - 0.06, fx + 0.06, WIN.y0 - 0.02, WIN.y0 + 0.04, z0, z1, M.led);
    for (const z of [z0, z1]) boxAt(fx - 0.06, fx + 0.06, WIN.y0, WIN.y1, z - 0.06, z + 0.06, M.frame);
  }
}
{ // north wall with the tunnel arch cut out
  const sh = new THREE.Shape(); sh.moveTo(-4, 0); sh.lineTo(4, 0); sh.lineTo(4, HALL_H); sh.lineTo(-4, HALL_H); sh.lineTo(-4, 0);
  const hole = new THREE.Path(); hole.moveTo(TUN_R, 0); hole.absarc(0, 0, TUN_R, 0, Math.PI, false); hole.lineTo(TUN_R, 0); sh.holes.push(hole);
  add(new THREE.ShapeGeometry(sh, 32), zoned(new THREE.MeshStandardMaterial({color: 0x17212c, roughness: 0.7, side: THREE.DoubleSide})), 0, 0, 78);
  const s = panel(['OCEAN VOYAGER', 'Open ocean · walk-through tunnel'], 6, 1.1, '#7fb6ff');
  s.position.set(0, 4.4, 77.95); s.rotation.y = Math.PI; scene.add(s);
}
light(0xcfe6ff, 18, 16, 0, HALL_H - 0.4, 30); light(0xcfe6ff, 18, 16, 0, HALL_H - 0.4, 62);
light(0xffe2b0, 35, 22, 0, LOBBY_H - 0.5, 5); light(0xdff4ff, 8, 10, 0, 2.5, 0.6);
scene.add(new THREE.HemisphereLight(0x7fa8c8, 0x0a1018, 0.35));

// ---------- platforms (shelves, benches, sills, bleachers) cats can jump on ----------
const platforms = [];
function platform(x0, x1, z0, z1, top, kind = 'box', mat = M.wood) {
  platforms.push({x0, x1, z0, z1, top});
  if (kind === 'shelf') {
    boxAt(x0, x1, top - 0.1, top, z0, z1, mat);
    boxAt(x0, x0 + 0.12, top - 0.45, top - 0.1, (z0 + z1) / 2 - 0.05, (z0 + z1) / 2 + 0.05, M.frame);
  } else if (kind === 'bench') {
    boxAt(x0, x1, top - 0.12, top, z0, z1, mat);
    for (const z of [z0 + 0.2, z1 - 0.2]) boxAt(x0 + 0.1, x1 - 0.1, 0, top - 0.12, z - 0.06, z + 0.06, M.frame);
  } else boxAt(x0, x1, 0, top, z0, z1, mat);
}
// lobby climbing wall (west): five shelves stepping up
[[3, 5, 0.45], [5.8, 7.8, 0.9], [8.6, 10.6, 1.35], [11.4, 13.4, 1.8], [14.2, 16.2, 2.25]].forEach(([z0, z1, t]) => platform(-12, -10.7, z0, z1, t, 'shelf'));
const climb = panel(['CAT LOOKOUT', 'Jump up the shelves!'], 2.4, 0.8, '#ffd166'); climb.position.set(-11.95, 3.4, 9.5); climb.rotation.y = Math.PI / 2; scene.add(climb);
// lobby east: carpeted cat cubes + bench
[[4, 5.6, 0.5], [6.2, 7.8, 1.0], [8.4, 10, 1.5]].forEach(([z0, z1, t]) => platform(10.2, 12, z0, z1, t, 'box', M.carpet));
platform(10.4, 11.8, 11.5, 16, 0.45, 'bench');

function tank(b, zone, o) {
  const w = b.x1 - b.x0, d = b.z1 - b.z0, cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
  const shell = std(o.wall, zone, {side: THREE.BackSide, map: rockTex(w, d), roughness: 1});
  add(new THREE.BoxGeometry(w, b.y1 - b.y0 + 2, d), shell, cx, (b.y0 + b.y1) / 2, cz);
  const seed = Math.random() * 10;
  b.ground = (x, z) => b.y0 + 0.35 * Math.sin(x * 0.4 + seed) * Math.cos(z * 0.35) + 0.25 * Math.sin(x * 0.13 + z * 0.17 + seed);
  const sg = new THREE.PlaneGeometry(w, d, Math.ceil(w), Math.ceil(d)).rotateX(-Math.PI / 2), sp = sg.attributes.position;
  for (let i = 0; i < sp.count; i++) sp.setY(i, b.ground(sp.getX(i) + cx, sp.getZ(i) + cz) - b.y0);
  sg.computeVertexNormals();
  add(sg, std(o.sand, zone, {roughness: 0.95, emissive: o.light, emissiveIntensity: 0.35, emissiveMap: causticTex(w, d)}), cx, b.y0, cz);
  if (!o.noSurface) {
    const surf = add(new THREE.PlaneGeometry(w, d), basic(o.light, zone, {transparent: true, opacity: 0.45, map: causticTex(w, d, 5), blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide}), cx, b.y1 - 0.15, cz);
    surf.rotation.x = Math.PI / 2;
  }
  const rayM = basic(o.light, zone, {transparent: true, opacity: 0.045, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide});
  for (let i = 0; i < (o.rays ?? 5); i++) {
    const h = b.y1 - b.y0, r = add(new THREE.ConeGeometry(rnd(1.5, 3), h, 12, 1, true), rayM, rnd(b.x0 + 2, b.x1 - 2), b.y0 + h / 2, rnd(b.z0 + 2, b.z1 - 2));
    r.rotation.set(rnd(-0.15, 0.15), 0, rnd(-0.15, 0.15));
  }
  const n = 120, bg = new THREE.BufferGeometry(), bp = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { bp[i * 3] = rnd(b.x0, b.x1); bp[i * 3 + 1] = rnd(b.y0, b.y1); bp[i * 3 + 2] = rnd(b.z0, b.z1); }
  bg.setAttribute('position', new THREE.BufferAttribute(bp, 3));
  scene.add(new THREE.Points(bg, zoned(new THREE.PointsMaterial({color: 0xe8fbff, size: 0.07, transparent: true, opacity: 0.55}), zone)));
  bubbleSets.push({bp, n, b, geo: bg});
  for (const [lx, lz] of o.lights || [[cx, cz]]) light(o.light, o.lightI ?? 420, o.lightD ?? 30, lx, b.y1 - 1, lz);
  b.zone = zone;
  b.spot = (margin = 1) => [rnd(b.x0 + margin, b.x1 - margin), rnd(b.z0 + margin, b.z1 - margin)];
  return b;
}

  }

  if (o.hammer) { const h = add(new THREE.BoxGeometry(1, 1, 1), fm(o.color, zone), 0, 0, o.l * 0.95, g); h.scale.set(o.w * 2.8, o.h * 0.25, o.l * 0.16); }

  const tm = add(TAIL, fm(o.tail || o.color, zone), 0, 0, -tl / 2, tail);

function findOrbit(T, p) {
  const pad = p.pad ?? 0.6, bob = p.bob ?? 0.3;
  for (let i = 0; i < 300; i++) {
    const rx = rnd(p.rMin, p.rMax), rz = p.circle ? rx : rx * rnd(0.6, 1.4);
    if (!p.center && (T.x1 - T.x0 < 2 * (pad + rx) || T.z1 - T.z0 < 2 * (pad + rz))) continue;
    const cx = p.center ? p.center[0] : rnd(T.x0 + pad + rx, T.x1 - pad - rx);
    const cz = p.center ? p.center[1] : rnd(T.z0 + pad + rz, T.z1 - pad - rz);
    const y = rnd(p.yMin ?? T.y0 + 0.8, p.yMax ?? T.y1 - 1);
    let ok = true;
    for (let k = 0; k < 32 && ok; k++) {
      const a = k / 32 * Math.PI * 2, x = cx + rx * Math.cos(a), z = cz + rz * Math.sin(a);
      if (x < T.x0 + pad || x > T.x1 - pad || z < T.z0 + pad || z > T.z1 - pad || y - bob < T.ground(x, z) + 0.3 + pad * 0.5 ||
          y + bob > T.y1 - 0.4 || (T.blocked && T.blocked(x, y, z, pad, bob))) ok = false;
    }
    if (ok) return {cx, cz, rx, rz, y, bob, ph: rnd(0, 6.28), speed: pick([-1, 1]) * p.speed / ((rx + rz) / 2)};
  }
  return null;
}
function addMover(T, obj, p, extra = {}) {
  const orbit = findOrbit(T, p); if (!orbit) return;
  scene.add(obj); movers.push({obj, orbit, wag: 8, ...extra});
}
function swim(T, kind, n, p, wag = 8) {
  for (let i = 0; i < n; i++) { const f = fish(SP[kind], T.zone); addMover(T, f.g, p, {tail: f.tail, wag, fluke: SP[kind].fluke}); }
}
function school(T, kind, n, spread, p) {
  const g = new THREE.Group(), members = [];
  for (let i = 0; i < n; i++) {
    const f = fish(SP[kind], T.zone), base = new THREE.Vector3(rnd(-spread, spread), rnd(-spread * 0.5, spread * 0.5), rnd(-spread * 1.3, spread * 1.3));
    f.g.position.copy(base); g.add(f.g); members.push({f, base, ph: rnd(0, 6.28)});
  }
  addMover(T, g, {pad: spread * 1.4, ...p}, {anim: t => members.forEach(m => {
    m.f.tail.rotation.y = Math.sin(t * 16 + m.ph) * 0.6;
    m.f.g.position.x = m.base.x + Math.sin(t * 1.3 + m.ph) * 0.15;
    m.f.g.position.y = m.base.y + Math.cos(t * 1.1 + m.ph) * 0.12;
  })});
}
function manta(zone) {

  add(SPH, m, 0, 0, 0, g).scale.set(0.7, 0.22, 1);
  add(SPH, fm(0xe6ecef, zone), 0, -0.08, 0, g).scale.set(0.6, 0.15, 0.9);

    const sh = new THREE.Shape(); sh.moveTo(0, 0.8); sh.lineTo(s * 2.4, -0.1); sh.lineTo(0, -0.7); sh.lineTo(0, 0.8);
    const pivot = new THREE.Group(); pivot.position.x = s * 0.55; g.add(pivot);
    add(new THREE.ShapeGeometry(sh).rotateX(-Math.PI / 2), m, 0, 0, 0, pivot); wings.push([pivot, s]);
    const horn = add(FIN, m, s * 0.35, 0, 1.05, g); horn.scale.set(0.08, 0.4, 0.06); horn.rotation.x = Math.PI / 2;
  }
  add(new THREE.CylinderGeometry(0.02, 0.04, 1.8), m, 0, 0, -1.8, g).rotation.x = Math.PI / 2;

function jelly(zone, color) {
  const g = new THREE.Group(), tents = [];
  const m = zoned(new THREE.MeshStandardMaterial({color, emissive: color, emissiveIntensity: 0.9, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false}), zone);
  const bell = add(new THREE.SphereGeometry(0.45, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), m, 0, 0, 0, g);
  for (let k = 0; k < 4; k++) { const r = add(new THREE.TorusGeometry(0.08, 0.025, 6, 12), glow(0xff9ad5, 1.5, zone), Math.cos(k * 1.57) * 0.14, 0.33, Math.sin(k * 1.57) * 0.14, g); r.rotation.x = Math.PI / 2; }
  for (let k = 0; k < 8; k++) {
    const a = k / 8 * Math.PI * 2, p = new THREE.Group(), len = rnd(0.8, 1.6);
    add(new THREE.CylinderGeometry(0.015, 0.005, len, 4), m, 0, -len / 2, 0, p);
    p.position.set(Math.cos(a) * 0.38, 0, Math.sin(a) * 0.38); g.add(p); tents.push([p, a]);
  }
  return {g, anim: t => {
    bell.scale.set(1 - Math.sin(t * 2) * 0.08, 1 + Math.sin(t * 2) * 0.15, 1 - Math.sin(t * 2) * 0.08);
    tents.forEach(([p, a]) => { p.rotation.x = Math.sin(t * 1.5 + a) * 0.25; p.rotation.z = Math.cos(t * 1.3 + a) * 0.25; });
  }};
}
function boulders(T, n, rMin, rMax, color, o = {}) {
  const mat = std(color, T.zone, {flatShading: true, roughness: 0.95, map: rockTex(4, 4, 2), ...o});
  for (let i = 0; i < n; i++) {
    const [x, z] = o.at ? o.at() : T.spot(rMax * 0.6), r = rnd(rMin, rMax);
    if (T.blocked && T.blocked(x, T.y0 + r * 0.4, z, r, 0)) continue;
    const m = add(rockGeo(r, 1, 0.25), mat, x, T.ground(x, z) + r * 0.25, z);
    m.scale.set(rnd(0.8, 1.4), rnd(0.5, 1), rnd(0.8, 1.4)); m.rotation.y = rnd(0, 6);
  }
}
function kelp(T, x, z, top, colors, width = 0.9) {
  const y0 = T.ground(x, z), h = top - y0, ph = rnd(0, 6.28), geo = new THREE.PlaneGeometry(width, h, 1, 30).translate(0, h / 2, 0);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setX(i, p.getX(i) * (0.45 + 0.55 * Math.abs(Math.sin(p.getY(i) * 1.6 + ph))));
  const mat = fm(pick(colors), T.zone, {side: THREE.DoubleSide, roughness: 0.7});
  const m = add(geo, mat, x, y0, z); m.rotation.y = rnd(0, Math.PI);
  add(geo, mat, 0, 0, 0, m).rotation.y = Math.PI / 2;
  kelps.push({geo, base: Float32Array.from(p.array), h, ph});
}
function anemone(T, x, z, color) {
  const g = new THREE.Group(), arms = [], m = fm(color, T.zone);
  for (let k = 0; k < 18; k++) {
    const pivot = new THREE.Group(), a = k / 18 * Math.PI * 2;
    add(new THREE.CylinderGeometry(0.04, 0.06, 0.8, 5), m, 0, 0.4, 0, pivot);
    pivot.position.set(Math.cos(a) * 0.25, 0, Math.sin(a) * 0.25); pivot.rotation.set(Math.sin(a) * 0.5, 0, -Math.cos(a) * 0.5);
    g.add(pivot); arms.push({pivot, a});
  }
  g.position.set(x, T.ground(x, z), z); scene.add(g);
  swayers.push(t => arms.forEach(({pivot, a}) => pivot.rotation.x = Math.sin(a) * 0.5 + Math.sin(t * 2 + a) * 0.15));
}

// ---------- walkable space + camera space ----------
function interior(x, y, z, m = 0) {
  if (x > -12 + m && x < 12 - m && z > m && z < 18 - m && y < LOBBY_H - m) return true;
  if (x > -4 + m && x < 4 - m && z > 17 && z < 78 && y < HALL_H - m) return true;
  if (z > 77 && z < 112.6 && Math.abs(x) < 2.25 && x * x + y * y < (TUN_R - m) ** 2) return true;
  return x > -13 + m && x < 13 - m && z > 112 && z < 128 - m && y < 6 - m;
}
const walkable = (x, z) => interior(x, 0.3, z, 0.3) && Math.hypot(x, z - 9) > 3.35 && JELLY_COLS.every(([jx, jz]) => Math.hypot(x - jx, z - jz) > 1.45);
const STEP = 0.32;
function groundAt(x, z, y) {
  let g = 0;
  for (const p of platforms) if (x > p.x0 && x < p.x1 && z > p.z0 && z < p.z1 && p.top <= y + STEP) g = Math.max(g, p.top);
  return g;
}
function blocked(x, z, y) {
  if (!walkable(x, z)) return true;
  for (const p of platforms) if (x > p.x0 && x < p.x1 && z > p.z0 && z < p.z1 && p.top > y + STEP) return true;
  return false;
}

  if (e.repeat) return;
  if (e.code === 'KeyM') say('Meow!');
  if (e.code === 'KeyN') say('Miao!');
  if (e.code === 'KeyK') say('Kelp!');
  if (e.code === 'Enter') { e.preventDefault(); $('msg').focus(); }
  if (e.code === 'Escape') leave();
});
addEventListener('keyup', e => { keys[e.code] = false; if (isFwd(e.code)) sprint = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; sprint = false; });
let drag = null;
renderer.domElement.addEventListener('pointerdown', e => { $('msg').blur(); drag = {id: e.pointerId, x: e.clientX, y: e.clientY}; });
addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId) return;
  yaw -= (e.clientX - drag.x) * 0.006;
  pitch = Math.max(0.02, Math.min(0.95, pitch + (e.clientY - drag.y) * 0.004));
  drag.x = e.clientX; drag.y = e.clientY;
});
addEventListener('pointerup', e => { if (drag && drag.id === e.pointerId) drag = null; });
renderer.domElement.addEventListener('wheel', e => { camDist = Math.max(1.8, Math.min(6, camDist + e.deltaY * 0.003)); }, {passive: true});
let joyId = null;
const joyEl = $('joy'), knob = $('knob');
const joyMove = e => {
  const r = joyEl.getBoundingClientRect(), dx = e.clientX - (r.left + 60), dy = e.clientY - (r.top + 60), d = Math.min(1, Math.hypot(dx, dy) / 50), a = Math.atan2(dy, dx);
  joy.x = Math.cos(a) * d; joy.y = -Math.sin(a) * d;
  knob.style.transform = `translate(${joy.x * 40}px,${-joy.y * 40}px)`;
};
joyEl.addEventListener('pointerdown', e => { joyId = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); e.stopPropagation(); });
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => { if (e.pointerId !== joyId) return; joyId = null; joy.x = joy.y = 0; knob.style.transform = ''; };
joyEl.addEventListener('pointerup', joyEnd); joyEl.addEventListener('pointercancel', joyEnd);

// ---------- loop ----------
const clock = new THREE.Clock(), camTarget = new THREE.Vector3();
let lastSend = 0, lastSent = '';
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  for (const c of caustics) c.offset.set(Math.sin(t * 0.13) * 0.3 + t * 0.015, Math.cos(t * 0.11) * 0.3);
  for (const k of kelps) {
    const p = k.geo.attributes.position, b = k.base;
    for (let i = 0; i < p.count; i++) {
      const y = b[i * 3 + 1], f = Math.max(0, y / k.h) ** 1.5;
      p.array[i * 3] = b[i * 3] + Math.sin(t * 0.9 + k.ph + y * 0.3) * 0.6 * f;
      p.array[i * 3 + 2] = Math.cos(t * 0.7 + k.ph + y * 0.25) * 0.4 * f;
    }
    p.needsUpdate = true;
  }
  for (const s of swayers) s(t);
  for (const s of bubbleSets) {
    for (let i = 0; i < s.n; i++) { s.bp[i * 3 + 1] += dt * 0.9; if (s.bp[i * 3 + 1] > s.b.y1 - 0.3) s.bp[i * 3 + 1] = s.b.y0; }
    s.geo.attributes.position.needsUpdate = true;
  }
  for (const m of movers) {
    const o = m.orbit, a = o.ph + t * o.speed;
    m.obj.position.set(o.cx + o.rx * Math.cos(a), o.y + Math.sin(t * 0.6 + o.ph) * o.bob, o.cz + o.rz * Math.sin(a));
    if (!m.noTurn) { const s = Math.sign(o.speed); m.obj.rotation.y = Math.atan2(-o.rx * Math.sin(a) * s, o.rz * Math.cos(a) * s); }
    if (m.tail) { const w = Math.sin(t * m.wag + o.ph) * 0.5; if (m.fluke) m.tail.rotation.x = w * 0.5; else m.tail.rotation.y = w; }
    if (m.anim) m.anim(t + o.ph);
  }

  if (me) {
    const typing = document.activeElement === $('msg');
    if (!typing) { if (keys.ArrowLeft) yaw += 1.8 * dt; if (keys.ArrowRight) yaw -= 1.8 * dt; }
    const f = typing ? joy.y : (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) + joy.y;
    const s = typing ? joy.x : (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joy.x;
    let mx = Math.sin(yaw) * f - Math.cos(yaw) * s, mz = Math.cos(yaw) * f + Math.sin(yaw) * s;
    const len = Math.hypot(mx, mz);
    me.moving = len > 0.1;
    me.fast = me.moving && (sprint || Math.hypot(joy.x, joy.y) > 0.97);
    if (me.moving) {
      if (len > 1) { mx /= len; mz /= len; }
      const step = (me.fast ? 7.5 : 4.2) * dt, nx = me.x + mx * step, nz = me.z + mz * step;
      if (!blocked(nx, nz, me.y)) { me.x = nx; me.z = nz; }
      else if (!blocked(nx, me.z, me.y)) me.x = nx;   // slide along walls
      else if (!blocked(me.x, nz, me.y)) me.z = nz;
      me.r = lerpAngle(me.r, Math.atan2(mx, mz), 1 - Math.exp(-12 * dt));
    }
    if (jumpQueued && me.onGround) { me.vy = 6.6; me.onGround = false; }
    jumpQueued = false;
    me.vy -= 20 * dt; me.y += me.vy * dt;
    const g = groundAt(me.x, me.z, me.y);
    if (me.y <= g) { me.y = g; me.vy = 0; me.onGround = true; } else me.onGround = false;
    me.cat.g.position.set(me.x, me.y, me.z); me.cat.g.rotation.y = me.r;
    animateCat(me.cat, {moving: me.moving, fast: me.fast, air: !me.onGround}, dt, t);

    // third-person camera, pulled in so it never ends up behind a wall
    camTarget.set(me.x, me.y + (catModel ? 0.5 : 0.75), me.z);
    const dx = -Math.sin(yaw) * Math.cos(pitch), dy = Math.sin(pitch), dz = -Math.cos(yaw) * Math.cos(pitch);
    let d = 0.4;
    while (d < camDist && interior(camTarget.x + dx * (d + 0.1), camTarget.y + dy * (d + 0.1), camTarget.z + dz * (d + 0.1), 0.12)) d += 0.1;
    camera.position.set(camTarget.x + dx * d, camTarget.y + dy * d, camTarget.z + dz * d);
    camera.lookAt(camTarget);
    placeTag(me.tag, me.cat.g.position);

    const snap = JSON.stringify(myState());
    if (t - lastSend > 0.08 && (snap !== lastSent || t - lastSend > 1)) { send.st(); lastSend = t; lastSent = snap; }
  } else { // attract mode behind the join screen: drift down the gallery
    const z = 20 + (t * 1.6) % 54;
    camera.position.set(Math.sin(t * 0.2) * 1.2, 2, z);
    camera.lookAt(Math.sin(t * 0.15) * 6, 1.6, z + 5);
  }

  for (const p of Object.values(peers)) {
    const g = p.cat.g, k = 1 - Math.exp(-10 * dt);
    g.position.x += (p.target.x - g.position.x) * k;
    g.position.y += (p.target.y - g.position.y) * k;
    g.position.z += (p.target.z - g.position.z) * k;
    g.rotation.y = lerpAngle(g.rotation.y, p.target.r, k);
    animateCat(p.cat, {moving: p.target.m, fast: p.target.f, air: p.target.a}, dt, t);
    placeTag(p.tag, g.position);
  }

  composer.render();
  requestAnimationFrame(frame);
}
frame();
</script>
